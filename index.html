<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vinç Kontrol</title>
</head>
<body style="text-align:center;font-family:Arial">

<h2>VINÇ KONTROL</h2>

<button onclick="send('/open')">AÇ</button><br><br>
<button onclick="send('/up')">YUKARI</button><br><br>
<button onclick="send('/down')">AŞAĞI</button><br><br>
<button onclick="send('/stop')">STOP</button><br><br>
<button onclick="send('/close')">KAPAT</button>

<script>
const ESP_IP = "http://192.168.1.XXX"; // ESP IP BURAYA

function send(cmd){
  fetch(ESP_IP + cmd).catch(()=>{});
}
</script>

</body>
</html>
